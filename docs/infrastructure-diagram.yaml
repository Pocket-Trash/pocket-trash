title: "Pocket Trash Infrastructure"
output: "docs/infrastructure-diagram.eraser"
source: "docs/infrastructure-diagram.yaml"
generatedBy: "pnpm diagram:infra"
scope:
  apps:
    - "@app/api"
    - "@app/discord-bot"
    - "@app/scraper"
    - "@app/web"
  packages:
    - "@package/database"
    - "@package/feature-flags"
    - "@package/logger"
    - "@package/markdown"
    - "@package/queue"
    - "@package/services"
    - "@package/storage"
  excludedApps: []
  excludedPackages:
    - "@package/lint"
    - "@package/tsconfig"
    - "@package/github-discord-notifier"
    - "@package/infisical-runner"
services:
  - id: "github_actions"
    label: "GitHub Actions"
    icon: "github"
    color: "gray"
  - id: "vercel"
    label: "Vercel"
    icon: "vercel"
    color: "black"
  - id: "railway"
    label: "Railway"
    icon: "server"
    color: "purple"
  - id: "neon"
    label: "Neon Postgres"
    icon: "postgresql"
    color: "green"
  - id: "infisical"
    label: "Infisical"
    icon: "lock"
    color: "purple"
  - id: "axiom"
    label: "Axiom"
    icon: "activity"
    color: "blue"
  - id: "clerk"
    label: "Clerk"
    icon: "lock"
    color: "purple"
  - id: "discord"
    label: "Discord"
    icon: "message-circle"
    color: "indigo"
environments:
  - id: "prod"
    label: "Production"
    color: "green"
    nodes:
      - id: "prod_web"
        label: "apps/web\nTanStack Start"
        service: "vercel"
        group: "Web"
      - id: "prod_scraper"
        label: "apps/scraper\nRailway service"
        service: "railway"
        group: "Ingestion"
      - id: "prod_discord_bot"
        label: "apps/discord-bot\nRailway service"
        service: "railway"
        group: "Notifications"
      - id: "prod_neon"
        label: "Neon production branch"
        service: "neon"
        group: "Data"
      - id: "prod_queue"
        label: "pocket-trash-queue\nRDB + AOF"
        service: "railway"
        group: "Data"
      - id: "prod_infisical"
        label: "Infisical prod secrets"
        service: "infisical"
        group: "Secrets"
      - id: "prod_axiom"
        label: "Axiom production dataset"
        service: "axiom"
        group: "Observability"
      - id: "prod_clerk"
        label: "Clerk auth"
        service: "clerk"
        group: "Identity"
      - id: "prod_discord"
        label: "Discord guild"
        service: "discord"
        group: "External"
      - id: "prod_github_actions"
        label: "release workflows"
        service: "github_actions"
        group: "Automation"
    edges:
      - from: "prod_github_actions"
        to: "prod_web"
        label: "deploy web"
      - from: "prod_github_actions"
        to: "prod_scraper"
        label: "deploy scraper"
      - from: "prod_github_actions"
        to: "prod_neon"
        label: "run migrations"
      - from: "prod_web"
        to: "prod_neon"
        label: "read/write"
      - from: "prod_web"
        to: "prod_axiom"
        label: "server and browser logs"
      - from: "prod_scraper"
        to: "prod_neon"
        label: "write product data"
      - from: "prod_scraper"
        to: "prod_queue"
        label: "scraper-images / scraper-items"
      - from: "prod_scraper"
        to: "prod_axiom"
        label: "service logs"
      - from: "prod_discord_bot"
        to: "prod_queue"
        label: "notification delivery"
      - from: "prod_discord_bot"
        to: "prod_discord"
        label: "gateway and messages"
      - from: "prod_discord_bot"
        to: "prod_axiom"
        label: "service logs"
      - from: "prod_infisical"
        to: "prod_discord_bot"
        label: "bot secrets"
  - id: "preview"
    label: "Preview"
    color: "yellow"
    nodes:
      - id: "preview_web"
        label: "Vercel preview"
        service: "vercel"
        group: "Web"
      - id: "preview_scraper"
        label: "Railway preview scraper"
        service: "railway"
        group: "Ingestion"
      - id: "preview_neon"
        label: "Neon preview branch"
        service: "neon"
        group: "Data"
      - id: "preview_queue"
        label: "pocket-trash-queue preview"
        service: "railway"
        group: "Data"
      - id: "preview_infisical"
        label: "Infisical preview secrets"
        service: "infisical"
        group: "Secrets"
      - id: "preview_axiom"
        label: "Axiom preview dataset"
        service: "axiom"
        group: "Observability"
    edges:
      - from: "preview_web"
        to: "preview_neon"
        label: "branch DATABASE_URL"
      - from: "preview_web"
        to: "preview_axiom"
        label: "same-origin log ingestion"
      - from: "preview_scraper"
        to: "preview_neon"
        label: "isolated data writes"
      - from: "preview_scraper"
        to: "preview_queue"
        label: "scraper queues"
  - id: "dev"
    label: "Local Development"
    color: "blue"
    nodes:
      - id: "dev_web"
        label: "apps/web\nlocalhost:4005"
        service: "vercel"
        group: "Web"
      - id: "dev_scraper"
        label: "apps/scraper"
        service: "railway"
        group: "Ingestion"
      - id: "dev_neon"
        label: "developer database"
        service: "neon"
        group: "Data"
      - id: "dev_queue"
        label: "local Redis queue"
        service: "railway"
        group: "Data"
      - id: "dev_infisical"
        label: "Infisical dev secrets"
        service: "infisical"
        group: "Secrets"
    edges:
      - from: "dev_infisical"
        to: "dev_web"
        label: "local env"
      - from: "dev_infisical"
        to: "dev_scraper"
        label: "local env"
      - from: "dev_web"
        to: "dev_neon"
        label: "read/write"
      - from: "dev_scraper"
        to: "dev_queue"
        label: "scraper queues"
detections:
  - id: webLogProxy
    source: "@app/web"
    target: axiom
    label: "source scan: browser log proxy -> /api/v0/logs"
    paths:
      - apps/web/src/lib/logger.ts
    patterns:
      - /api/v0/logs
      - createProxyTransport
  - id: webClerk
    source: "@app/web"
    target: clerk
    label: "source scan: Clerk web SDK"
    paths:
      - apps/web/src
    patterns:
      - "@clerk/tanstack-react-start"
  - id: webAxiom
    source: "@app/web"
    target: axiom
    label: "source scan: createAxiomTransport"
    paths:
      - apps/web
    patterns:
      - createAxiomTransport
      - AXIOM_TOKEN
relationships: []
