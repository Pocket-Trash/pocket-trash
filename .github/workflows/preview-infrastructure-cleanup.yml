name: Preview Infrastructure Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  DB_PREVIEW_COMMENT_MARKER: "<!-- pocket-trash-db-preview -->"

jobs:
  preview-closed:
    name: Preview Infrastructure Closed
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    env:
      CI_JOB_NAME: Preview Infrastructure Closed
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch GitHub secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: preview
          secret-path: tools/github/secrets

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete Neon PR branch
        id: neon_cleanup
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/neon-database-branch.sh cleanup-preview

      - name: Remove Vercel branch database override
        id: vercel_cleanup
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/vercel-branch-database-url.sh remove

      - name: Remove Vercel branch image folder prefix
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/vercel-branch-database-url.sh remove-image-folder-prefix

      - name: Remove Vercel branch resource folder prefix
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/vercel-branch-database-url.sh remove-resource-folder-prefix

      - name: Remove Vercel branch resource API URL
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/vercel-branch-database-url.sh remove-resource-api-base-url

      - name: Delete image PR preview folder
        id: image_cleanup
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm --filter @package/images run cleanup:preview-folder

      - name: Delete resource PR preview folder
        id: resource_cleanup
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm --filter @package/resources run cleanup:preview-folder

      - name: Remove db-change label
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: "db-change",
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Create DB preview comment app token
        id: db-preview-comment-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.POCKET_TRASH_DB_PREVIEW_APP_CLIENT_ID }}
          private-key: ${{ env.POCKET_TRASH_DB_PREVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Mark DB preview comment closed
        uses: actions/github-script@v8
        env:
          CLEANUP_PERFORMED: ${{ steps.neon_cleanup.outputs.cleanup_performed }}
          IMAGE_CLEANUP_STATUS: ${{ steps.image_cleanup.outputs.status }}
          IMAGE_FOLDER_PATH: ${{ steps.image_cleanup.outputs.folder_path }}
          RESOURCE_CLEANUP_STATUS: ${{ steps.resource_cleanup.outputs.status }}
          RESOURCE_FOLDER_PATH: ${{ steps.resource_cleanup.outputs.folder_path }}
          TARGET_BRANCH: ${{ steps.neon_cleanup.outputs.target_branch }}
        with:
          github-token: ${{ steps.db-preview-comment-token.outputs.token }}
          script: |
            const marker = process.env.DB_PREVIEW_COMMENT_MARKER;
            const cleanup = process.env.CLEANUP_PERFORMED === "true"
              ? "Deleted"
              : "No active branch found";
            const body = [
              marker,
              "The DB preview for this pull request is inactive because the pull request is closed.",
              "",
              `Neon cleanup: ${cleanup} for \`${process.env.TARGET_BRANCH}\``,
              `Image cleanup: ${process.env.IMAGE_CLEANUP_STATUS} for \`${process.env.IMAGE_FOLDER_PATH}\``,
              `Resource cleanup: ${process.env.RESOURCE_CLEANUP_STATUS} for \`${process.env.RESOURCE_FOLDER_PATH}\``,
              "Vercel branch-specific `DATABASE_URL`, `IMAGE_FOLDER_PREFIX`, and `RESOURCE_FOLDER_PREFIX` cleanup was attempted.",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            }
