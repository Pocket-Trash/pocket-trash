name: Preview Refresh

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    name: Refresh Preview
    runs-on: ubuntu-latest
    env:
      BUNNY_IMAGE_FOLDER_PREFIX: images/preview
      BUNNY_RESOURCE_FOLDER_PREFIX: resources/preview
      CI_JOB_NAME: Refresh Preview

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch GitHub secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: preview
          secret-path: tools/github/secrets

      - name: Fetch API secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: dev
          secret-path: /apps/api

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh preview from development
        id: preview_db
        shell: bash
        run: bash .github/scripts/neon-database-branch.sh refresh-preview

      - name: Run preview migrations and seed data
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ steps.preview_db.outputs.migration_database_url }}
        run: |
          set -euo pipefail

          set +e
          pnpm exec drizzle-kit migrate --config=drizzle.config.ts
          migration_status=$?
          set -e

          source ../../.github/scripts/ci-log.sh
          if [[ "$migration_status" -ne 0 ]]; then
            emit_ci_log error "ci.database.preview.migrations.failed" "$(jq -n \
              --arg branch_name "${{ steps.preview_db.outputs.branch_name }}" \
              --arg branch_id "${{ steps.preview_db.outputs.branch_id }}" \
              --arg failure_step "drizzle-kit migrate" \
              '{
                branchName: $branch_name,
                branchId: $branch_id,
                failureStep: $failure_step
              }')"
            exit "$migration_status"
          fi

          emit_ci_log info "ci.database.preview.migrations.applied" "$(jq -n \
            --arg branch_name "${{ steps.preview_db.outputs.branch_name }}" \
            --arg branch_id "${{ steps.preview_db.outputs.branch_id }}" \
            '{
              branchName: $branch_name,
              branchId: $branch_id
            }')"

          pnpm exec tsx scripts/seed.ts
