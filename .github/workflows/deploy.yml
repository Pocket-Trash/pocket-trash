name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: production
        type: choice
        options:
          - production
          - development

permissions:
  contents: read

env:
  API_PREVIEW_COMMENT_MARKER: "<!-- pocket-trash-api-preview-app -->"
  DB_PREVIEW_COMMENT_MARKER: "<!-- pocket-trash-db-preview -->"
  RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME: "pocket-trash (preview)"
  RAILWAY_SCRAPER_PRODUCTION_SERVICE_NAME: "pocket-trash"
  RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME: "scraper-queue"

jobs:
  classify-changes:
    name: Classify Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.classify.outputs.api }}
      scraper: ${{ steps.classify.outputs.scraper }}
      web: ${{ steps.classify.outputs.web }}
      database: ${{ steps.classify.outputs.database }}
      storybook: ${{ steps.classify.outputs.storybook }}
      preview: ${{ steps.classify.outputs.preview }}
      safe_e2e: ${{ steps.classify.outputs.safe_e2e }}
      mutation_e2e: ${{ steps.classify.outputs.mutation_e2e }}
      validation: ${{ steps.classify.outputs.validation }}

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Classify changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if ! node scripts/classify-changes.mjs; then
            for domain in api scraper web database storybook preview safe_e2e mutation_e2e validation; do
              echo "$domain=true" >> "$GITHUB_OUTPUT"
            done
          fi

  preview:
    name: Preview
    needs: classify-changes
    if: github.event_name == 'pull_request' && github.event.action != 'unlabeled' && github.event.pull_request.head.repo.full_name == github.repository && (needs.classify-changes.outputs.preview == 'true' || (github.event.action == 'labeled' && github.event.label.name == 'preview:webhooks'))
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.db.outputs.can_deploy }}
      database_branch: ${{ steps.db.outputs.branch_name }}
      deployment_id: ${{ steps.vercel_preview.outputs.deployment_id }}
      isolated: ${{ steps.db.outputs.isolated }}
      web_preview_url: ${{ steps.vercel_preview.outputs.web_preview_url }}
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    env:
      CI_JOB_NAME: Preview
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch GitHub secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: preview
          secret-path: tools/github/secrets

      - name: Fetch API secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: preview
          secret-path: /apps/api

      - name: Detect database changes
        id: db_changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/detect-database-changes.sh

      - name: Sync db-change label
        uses: actions/github-script@v8
        env:
          DATABASE_CHANGED: ${{ steps.db_changes.outputs.database }}
        with:
          script: |
            const label = "db-change";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            if (process.env.DATABASE_CHANGED === "true") {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [label],
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: "0969da",
                  description: "Changes database schema or migrations",
                });
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [label],
                });
              }
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            console.log(JSON.stringify({
              app: "ci",
              environment: "github-actions",
              level: "info",
              message: "ci.github.dbChangeLabel.synced",
              timestamp: new Date().toISOString(),
              attributes: {
                databaseChanged: process.env.DATABASE_CHANGED === "true",
                label,
                pullRequestNumber: String(issue_number),
              },
            }));

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API workspace dependencies
        run: pnpm turbo run build --filter=@app/api

      - name: Validate API preview configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in AXIOM_DATASET AXIOM_TOKEN CLERK_SECRET_KEY CLERK_WEBHOOK_SIGNING_SECRET LINEAR_WEBHOOK_SIGNING_SECRET CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN LOG_PROXY_CLIENT_KEY ERASURE_HMAC_SECRET BUNNY_API_KEY BUNNY_CDN_BASE_URL BUNNY_CDN_TOKEN_KEY BUNNY_PULL_ZONE_ID BUNNY_STORAGE_ACCESS_KEY BUNNY_STORAGE_ENDPOINT BUNNY_STORAGE_ZONE_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Deploy API preview
        id: api_preview
        working-directory: apps/api
        shell: bash
        env:
          LOG_DEPLOYMENT_ID: pr-${{ github.event.pull_request.number }}
          MUTATION_E2E: ${{ needs.classify-changes.outputs.mutation_e2e == 'true' || contains(github.event.pull_request.labels.*.name, 'test:e2e') }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$MUTATION_E2E" == "true" ]]; then
            resource_folder_prefix="resources/preview/pr-${PR_NUMBER}"
            image_folder_prefix="images/preview/pr-${PR_NUMBER}"
          else
            resource_folder_prefix="resources/preview"
            image_folder_prefix="images/preview"
          fi

          api_vars=(
            --var "APP_ENV:preview"
            --var "AXIOM_DATASET:${AXIOM_DATASET}"
            --var "LOG_DEPLOYMENT_ID:${LOG_DEPLOYMENT_ID}"
            --var "LOG_DEPLOYMENT_TARGET:cloudflare-worker"
            --var "BUNNY_CDN_BASE_URL:${BUNNY_CDN_BASE_URL}"
            --var "BUNNY_IMAGE_FOLDER_PREFIX:${image_folder_prefix}"
            --var "BUNNY_RESOURCE_FOLDER_PREFIX:${resource_folder_prefix}"
            --var "BUNNY_STORAGE_ENDPOINT:${BUNNY_STORAGE_ENDPOINT}"
            --var "BUNNY_STORAGE_ZONE_NAME:${BUNNY_STORAGE_ZONE_NAME}"
          )

          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          jq -cn \
            --arg axiom_token "$AXIOM_TOKEN" \
            --arg clerk_secret_key "$CLERK_SECRET_KEY" \
            --arg clerk_webhook_signing_secret "$CLERK_WEBHOOK_SIGNING_SECRET" \
            --arg linear_webhook_signing_secret "$LINEAR_WEBHOOK_SIGNING_SECRET" \
            --arg erasure_hmac_secret "$ERASURE_HMAC_SECRET" \
            --arg log_proxy_client_key "$LOG_PROXY_CLIENT_KEY" \
            --arg bunny_api_key "$BUNNY_API_KEY" \
            --arg bunny_cdn_token_key "$BUNNY_CDN_TOKEN_KEY" \
            --arg bunny_pull_zone_id "$BUNNY_PULL_ZONE_ID" \
            --arg resource_storage_access_key "$BUNNY_STORAGE_ACCESS_KEY" \
            '{AXIOM_TOKEN: $axiom_token, CLERK_SECRET_KEY: $clerk_secret_key, CLERK_WEBHOOK_SIGNING_SECRET: $clerk_webhook_signing_secret, LINEAR_WEBHOOK_SIGNING_SECRET: $linear_webhook_signing_secret, ERASURE_HMAC_SECRET: $erasure_hmac_secret, LOG_PROXY_CLIENT_KEY: $log_proxy_client_key, BUNNY_API_KEY: $bunny_api_key, BUNNY_CDN_TOKEN_KEY: $bunny_cdn_token_key, BUNNY_PULL_ZONE_ID: $bunny_pull_zone_id, BUNNY_STORAGE_ACCESS_KEY: $resource_storage_access_key}' > "$secrets_file"
          pnpm exec wrangler versions upload \
            --env preview \
            --preview-alias "$PREVIEW_ALIAS" \
            --secrets-file "$secrets_file" \
            --keep-vars \
            "${api_vars[@]}"

          workers_subdomain="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" | \
            jq -er '.result.subdomain')"
          preview_url="https://${PREVIEW_ALIAS}-pocket-trash-api-preview.${workers_subdomain}.workers.dev"

          curl --fail --retry 5 --retry-all-errors --retry-delay 2 \
            --silent --show-error "${preview_url}/api/v0/health" | \
            jq -e '.ok == true and .service == "api"' >/dev/null
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 \
            --silent --show-error "${preview_url}/api/v0/openapi.json" | \
            jq -e '.openapi == "3.1.0"' >/dev/null
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 \
            --silent --show-error "${preview_url}/api/v0/docs" >/dev/null

          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Validate API preview comment app configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in GITHUB_CF_APP_CLIENT_ID GITHUB_CF_APP_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Create API preview comment app token
        id: api-preview-comment-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.GITHUB_CF_APP_CLIENT_ID }}
          private-key: ${{ env.GITHUB_CF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Comment on API preview
        uses: actions/github-script@v8
        env:
          API_PREVIEW_URL: ${{ steps.api_preview.outputs.url }}
        with:
          github-token: ${{ steps.api-preview-comment-token.outputs.token }}
          script: |
            const marker = process.env.API_PREVIEW_COMMENT_MARKER;
            const previewUrl = process.env.API_PREVIEW_URL;
            const alias = `pr-${context.issue.number}`;
            const body = [
              marker,
              "Cloudflare API preview",
              "",
              "| Worker | Alias | Status | Endpoints |",
              "| --- | --- | --- | --- |",
              `| \`pocket-trash-api-preview\` | \`${alias}\` | ✅ Ready | [Health](${previewUrl}/api/v0/health) · [OpenAPI](${previewUrl}/api/v0/openapi.json) |`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Configure Vercel branch resource API URL
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          API_URL: ${{ steps.api_preview.outputs.url }}
        run: bash .github/scripts/vercel-branch-database-url.sh set-resource-api-base-url

      - name: Validate preview database configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in NEON_API_KEY NEON_PROJECT_ID NEON_DATABASE_NAME NEON_DATABASE_USER VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN RAILWAY_API_TOKEN RAILWAY_PROJECT_ID RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Prepare Neon preview database
        id: db
        shell: bash
        env:
          ISOLATION_REQUIRED: ${{ needs.classify-changes.outputs.mutation_e2e == 'true' || contains(github.event.pull_request.labels.*.name, 'test:e2e') }}
          MAX_NEON_BRANCHES: 10
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/neon-database-branch.sh prepare-preview

      - name: Configure Vercel branch database override
        if: steps.db.outputs.can_deploy == 'true' && steps.db.outputs.isolated == 'true'
        id: vercel
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
        run: bash .github/scripts/vercel-branch-database-url.sh set

      - name: Remove stale Vercel branch database override
        if: steps.db.outputs.can_deploy == 'true' && steps.db.outputs.isolated != 'true'
        id: vercel_cleanup
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/vercel-branch-database-url.sh remove

      - name: Configure Vercel branch image folder prefix
        if: steps.db.outputs.can_deploy == 'true'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          ISOLATED: ${{ steps.db.outputs.isolated }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$ISOLATED" == "true" ]]; then
            export BUNNY_IMAGE_FOLDER_PREFIX="images/preview/pr-${PR_NUMBER}"
          else
            export BUNNY_IMAGE_FOLDER_PREFIX="images/preview"
          fi

          bash .github/scripts/vercel-branch-database-url.sh set-image-folder-prefix

      - name: Configure Vercel branch resource folder prefix
        if: steps.db.outputs.can_deploy == 'true'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          ISOLATED: ${{ steps.db.outputs.isolated }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$ISOLATED" == "true" ]]; then
            export BUNNY_RESOURCE_FOLDER_PREFIX="resources/preview/pr-${PR_NUMBER}"
          else
            export BUNNY_RESOURCE_FOLDER_PREFIX="resources/preview"
          fi

          bash .github/scripts/vercel-branch-database-url.sh set-resource-folder-prefix

      - name: Run migrations on Neon PR branch
        if: steps.db.outputs.can_deploy == 'true' && steps.db.outputs.isolated == 'true'
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ steps.db.outputs.migration_database_url }}
        run: |
          set -euo pipefail

          set +e
          pnpm exec drizzle-kit migrate --config=drizzle.config.ts
          migration_status=$?
          set -e

          source ../../.github/scripts/ci-log.sh
          if [[ "$migration_status" -ne 0 ]]; then
            emit_ci_log error "ci.database.preview.migrations.failed" "$(jq -n \
              --arg branch_name "${{ steps.db.outputs.branch_name }}" \
              --arg branch_id "${{ steps.db.outputs.branch_id }}" \
              --arg failure_step "drizzle-kit migrate" \
              '{
                branchName: $branch_name,
                branchId: $branch_id,
                failureStep: $failure_step
              }')"
            exit "$migration_status"
          fi

          emit_ci_log info "ci.database.preview.migrations.applied" "$(jq -n \
            --arg branch_name "${{ steps.db.outputs.branch_name }}" \
            --arg branch_id "${{ steps.db.outputs.branch_id }}" \
            '{
              branchName: $branch_name,
              branchId: $branch_id
            }')"

          pnpm exec tsx scripts/seed.ts

      - name: Verify Neon PR branch
        if: steps.db.outputs.can_deploy == 'true' && steps.db.outputs.isolated == 'true'
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.db.outputs.branch_name }}
        run: bash .github/scripts/neon-database-branch.sh branch-url

      - name: Configure API preview upload runtime
        if: steps.db.outputs.can_deploy == 'true'
        working-directory: apps/api
        shell: bash
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          ISOLATED: ${{ steps.db.outputs.isolated }}
          LOG_DEPLOYMENT_ID: pr-${{ github.event.pull_request.number }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$ISOLATED" == "true" ]]; then
            resource_folder_prefix="resources/preview/pr-${PR_NUMBER}"
            image_folder_prefix="images/preview/pr-${PR_NUMBER}"
          else
            resource_folder_prefix="resources/preview"
            image_folder_prefix="images/preview"
          fi

          jq -cn \
            --arg axiom_token "$AXIOM_TOKEN" \
            --arg clerk_secret_key "$CLERK_SECRET_KEY" \
            --arg clerk_webhook_signing_secret "$CLERK_WEBHOOK_SIGNING_SECRET" \
            --arg linear_webhook_signing_secret "$LINEAR_WEBHOOK_SIGNING_SECRET" \
            --arg database_url "$DATABASE_URL" \
            --arg erasure_hmac_secret "$ERASURE_HMAC_SECRET" \
            --arg log_proxy_client_key "$LOG_PROXY_CLIENT_KEY" \
            --arg bunny_api_key "$BUNNY_API_KEY" \
            --arg bunny_cdn_token_key "$BUNNY_CDN_TOKEN_KEY" \
            --arg bunny_pull_zone_id "$BUNNY_PULL_ZONE_ID" \
            --arg resource_storage_access_key "$BUNNY_STORAGE_ACCESS_KEY" \
            '{AXIOM_TOKEN: $axiom_token, CLERK_SECRET_KEY: $clerk_secret_key, CLERK_WEBHOOK_SIGNING_SECRET: $clerk_webhook_signing_secret, LINEAR_WEBHOOK_SIGNING_SECRET: $linear_webhook_signing_secret, DATABASE_URL: $database_url, ERASURE_HMAC_SECRET: $erasure_hmac_secret, LOG_PROXY_CLIENT_KEY: $log_proxy_client_key, BUNNY_API_KEY: $bunny_api_key, BUNNY_CDN_TOKEN_KEY: $bunny_cdn_token_key, BUNNY_PULL_ZONE_ID: $bunny_pull_zone_id, BUNNY_STORAGE_ACCESS_KEY: $resource_storage_access_key}' | \
            pnpm exec wrangler versions upload \
            --env preview \
            --preview-alias "$PREVIEW_ALIAS" \
            --secrets-file /dev/stdin \
            --var "APP_ENV:preview" \
            --var "AXIOM_DATASET:${AXIOM_DATASET}" \
            --var "LOG_DEPLOYMENT_ID:${LOG_DEPLOYMENT_ID}" \
            --var "LOG_DEPLOYMENT_TARGET:cloudflare-worker" \
            --var "BUNNY_CDN_BASE_URL:${BUNNY_CDN_BASE_URL}" \
            --var "BUNNY_IMAGE_FOLDER_PREFIX:${image_folder_prefix}" \
            --var "BUNNY_RESOURCE_FOLDER_PREFIX:${resource_folder_prefix}" \
            --var "BUNNY_STORAGE_ENDPOINT:${BUNNY_STORAGE_ENDPOINT}" \
            --var "BUNNY_STORAGE_ZONE_NAME:${BUNNY_STORAGE_ZONE_NAME}"

      - name: Reconcile and register webhook-enabled API preview
        if: steps.db.outputs.can_deploy == 'true' && contains(github.event.pull_request.labels.*.name, 'preview:webhooks')
        working-directory: apps/api
        shell: bash
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          PREVIEW_URL: ${{ steps.api_preview.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          pnpm exec tsx src/scripts/reconcile-clerk-users.ts
          clerk_target_url="${PREVIEW_URL}/api/v0/webhooks/clerk"
          linear_target_url="${PREVIEW_URL}/api/v0/webhooks/linear"
          pnpm exec wrangler kv key put "target:preview:${PR_NUMBER}" "enabled" \
            --binding CLERK_WEBHOOK_TARGETS \
            --env development \
            --remote \
            --metadata "$(jq -cn --arg url "$clerk_target_url" '{kind:"preview", url:$url}')"
          pnpm exec wrangler kv key put "linear-target:preview:${PR_NUMBER}" "enabled" \
            --binding CLERK_WEBHOOK_TARGETS \
            --env development \
            --remote \
            --metadata "$(jq -cn --arg url "$linear_target_url" '{kind:"preview", url:$url}')"

          {
            echo "### Webhook forwarding"
            echo ""
            echo "Registered \`target:preview:${PR_NUMBER}\` → ${clerk_target_url}"
            echo "Registered \`linear-target:preview:${PR_NUMBER}\` → ${linear_target_url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Vercel preview from Git
        if: steps.db.outputs.can_deploy == 'true'
        id: vercel_preview
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: bash .github/scripts/vercel-branch-database-url.sh deploy-preview

      - name: Configure Railway scraper preview database and cron
        if: steps.db.outputs.can_deploy == 'true'
        shell: bash
        env:
          DB_CHANGING: ${{ steps.db_changes.outputs.database }}
          ISOLATED: ${{ steps.db.outputs.isolated }}
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          printf '::add-mask::%s\n' "$DATABASE_URL"

          railway_environment="pocket-trash-pr-${PR_NUMBER}"
          if [[ "$ISOLATED" == "true" ]]; then
            image_folder_prefix="images/preview/pr-${PR_NUMBER}"
          else
            image_folder_prefix="images/preview"
          fi
          if [[ "$DB_CHANGING" == "true" ]]; then
            scraper_cron_enabled="true"
          else
            scraper_cron_enabled="false"
          fi
          redis_url_reference='$'"{{${RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME}.REDIS_PUBLIC_URL}}"

          jq -cn \
            --arg app "ci" \
            --arg environment "github-actions" \
            --arg level "info" \
            --arg message "ci.railway.preview.imageFolderPrefix.selected" \
            --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg railway_environment "$railway_environment" \
            --arg service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --arg image_folder_prefix "$image_folder_prefix" \
            --arg scraper_cron_enabled "$scraper_cron_enabled" \
            --argjson database "$DB_CHANGING" \
            '{
              app: $app,
              environment: $environment,
              level: $level,
              message: $message,
              timestamp: $timestamp,
              attributes: {
                databaseChanged: $database,
                railwayEnvironment: $railway_environment,
                service: $service,
                imageFolderPrefix: $image_folder_prefix,
                scraperCronEnabled: $scraper_cron_enabled
              }
            }'

          printf '%s' "$DATABASE_URL" | pnpm dlx @railway/cli variable set DATABASE_URL \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          printf '%s' "$image_folder_prefix" | pnpm dlx @railway/cli variable set BUNNY_IMAGE_FOLDER_PREFIX \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          printf '%s' "$redis_url_reference" | pnpm dlx @railway/cli variable set REDIS_URL \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          printf '%s' "$scraper_cron_enabled" | pnpm dlx @railway/cli variable set SCRAPER_CRON_ENABLED \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          printf '%s' "$railway_environment" | pnpm dlx @railway/cli variable set LOG_DEPLOYMENT_ID \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          printf '%s' "railway" | pnpm dlx @railway/cli variable set LOG_DEPLOYMENT_TARGET \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          railway_image_folder_prefix="$(
            pnpm dlx @railway/cli variable list \
              --kv \
              --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
              --environment "$railway_environment" |
              awk -F= '$1 == "BUNNY_IMAGE_FOLDER_PREFIX" {print substr($0, index($0, "=") + 1)}'
          )"

          if [[ "$railway_image_folder_prefix" != "$image_folder_prefix" ]]; then
            echo "Railway BUNNY_IMAGE_FOLDER_PREFIX did not match expected preview prefix." >&2
            echo "Expected: ${image_folder_prefix}" >&2
            echo "Actual: ${railway_image_folder_prefix:-<unset>}" >&2
            exit 1
          fi

          railway_scraper_cron_enabled="$(
            pnpm dlx @railway/cli variable list \
              --kv \
              --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
              --environment "$railway_environment" |
              awk -F= '$1 == "SCRAPER_CRON_ENABLED" {print substr($0, index($0, "=") + 1)}'
          )"

          if [[ "$railway_scraper_cron_enabled" != "$scraper_cron_enabled" ]]; then
            echo "Railway SCRAPER_CRON_ENABLED did not match expected preview setting." >&2
            echo "Expected: ${scraper_cron_enabled}" >&2
            echo "Actual: ${railway_scraper_cron_enabled:-<unset>}" >&2
            exit 1
          fi

      - name: Deploy Railway scraper queue preview
        if: steps.db.outputs.can_deploy == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          railway_environment="pocket-trash-pr-${PR_NUMBER}"

          jq -cn \
            --arg app "ci" \
            --arg environment "github-actions" \
            --arg level "info" \
            --arg message "ci.railway.preview.queue.deployStarted" \
            --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg railway_environment "$railway_environment" \
            --arg service "$RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME" \
            '{
              app: $app,
              environment: $environment,
              level: $level,
              message: $message,
              timestamp: $timestamp,
              attributes: {
                railwayEnvironment: $railway_environment,
                service: $service
              }
            }'

          printf '%s' "$railway_environment" | pnpm dlx @railway/cli variable set LOG_DEPLOYMENT_ID \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          printf '%s' "railway" | pnpm dlx @railway/cli variable set LOG_DEPLOYMENT_TARGET \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          pnpm dlx @railway/cli service redeploy \
            --from-source \
            --yes \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

      - name: Create DB preview comment app token
        id: db-preview-comment-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.POCKET_TRASH_DB_PREVIEW_APP_CLIENT_ID }}
          private-key: ${{ env.POCKET_TRASH_DB_PREVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Comment on blocked DB preview
        if: steps.db.outputs.isolated == 'true' && steps.db.outputs.can_deploy != 'true'
        uses: actions/github-script@v8
        env:
          BRANCH_COUNT: ${{ steps.db.outputs.branch_count }}
          BRANCH_NAMES: ${{ steps.db.outputs.branch_names }}
          TARGET_BRANCH: ${{ steps.db.outputs.target_branch }}
        with:
          github-token: ${{ steps.db-preview-comment-token.outputs.token }}
          script: |
            const marker = process.env.DB_PREVIEW_COMMENT_MARKER;
            const branchNames = (process.env.BRANCH_NAMES || "")
              .split("\n")
              .filter(Boolean)
              .map((name) => `- \`${name}\``)
              .join("\n");
            const actionsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions`;
            const retryUrl = `${actionsUrl}/runs/${process.env.GITHUB_RUN_ID}`;
            const historyUrl = `${actionsUrl}/workflows/deploy.yml?query=${encodeURIComponent(`branch:${process.env.GITHUB_HEAD_REF}`)}`;
            const body = [
              marker,
              "DB-isolated preview creation is blocked because the Neon branch limit has been reached.",
              "",
              `Requested branch: \`${process.env.TARGET_BRANCH}\``,
              `Branch capacity: \`${process.env.BRANCH_COUNT}/10\``,
              "",
              "Active Neon branches:",
              branchNames || "- none reported",
              "",
              "Close stale DB-changing PRs or delete stale `preview-pr-*` branches, then push a new commit or rerun the Deploy workflow.",
              "",
              `[Open Deploy run to retry](${retryUrl}) · [Deploy history for this branch](${historyUrl})`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Comment on ready DB preview
        if: steps.db.outputs.isolated == 'true' && steps.db.outputs.can_deploy == 'true'
        uses: actions/github-script@v8
        env:
          BRANCH_NAME: ${{ steps.db.outputs.branch_name }}
          BRANCH_URL: ${{ steps.db.outputs.branch_url }}
          DB_CHANGING: ${{ steps.db_changes.outputs.database }}
          PARENT_BRANCH: ${{ steps.db.outputs.parent_branch }}
          WEB_PREVIEW_URL: ${{ steps.vercel_preview.outputs.web_preview_url }}
        with:
          github-token: ${{ steps.db-preview-comment-token.outputs.token }}
          script: |
            const marker = process.env.DB_PREVIEW_COMMENT_MARKER;
            const webPreviewUrl = process.env.WEB_PREVIEW_URL;
            const webPreview = webPreviewUrl
              ? `[Preview](${webPreviewUrl})`
              : "Vercel preview URL not available to this workflow yet; the branch-specific env var is set for the next preview deployment.";
            const migrationStatus = process.env.DB_CHANGING === "true"
              ? "Committed Drizzle migrations applied"
              : "Development schema inherited";
            const body = [
              marker,
              "DB-isolated preview is ready for this pull request.",
              "",
              "| Item | Value |",
              "| --- | --- |",
              `| Neon branch | [\`${process.env.BRANCH_NAME}\`](${process.env.BRANCH_URL}) |`,
              `| Parent branch | \`${process.env.PARENT_BRANCH}\` |`,
              `| Migration status | ${migrationStatus} |`,
              `| Web preview | ${webPreview} |`,
              "",
              "The `preview-pr-*` branch and branch-specific Vercel `DATABASE_URL`, `BUNNY_IMAGE_FOLDER_PREFIX`, and `BUNNY_RESOURCE_FOLDER_PREFIX` are deleted when the PR closes.",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Cleanup failed DB preview resources
        if: ${{ always() && steps.db.outputs.isolated == 'true' && steps.db.outputs.branch_created == 'true' && (failure() || cancelled()) }}
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e

          bash .github/scripts/neon-database-branch.sh cleanup-preview
          neon_status=$?

          bash .github/scripts/vercel-branch-database-url.sh remove
          vercel_status=$?

          bash .github/scripts/vercel-branch-database-url.sh remove-image-folder-prefix
          vercel_image_status=$?

          bash .github/scripts/vercel-branch-database-url.sh remove-resource-folder-prefix
          vercel_resource_status=$?

          bash .github/scripts/vercel-branch-database-url.sh remove-resource-api-base-url
          vercel_resource_api_status=$?

          if [[ "$neon_status" -ne 0 || "$vercel_status" -ne 0 || "$vercel_image_status" -ne 0 || "$vercel_resource_status" -ne 0 || "$vercel_resource_api_status" -ne 0 ]]; then
            echo "Preview cleanup encountered errors: neon=${neon_status}, vercel=${vercel_status}, vercel_image=${vercel_image_status}, vercel_resource=${vercel_resource_status}, vercel_resource_api=${vercel_resource_api_status}." >&2
          fi

          exit 0

  e2e:
    name: E2E
    needs: [classify-changes, preview]
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.preview.outputs.can_deploy == 'true' && (needs.classify-changes.outputs.safe_e2e == 'true' || needs.classify-changes.outputs.mutation_e2e == 'true')
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CI_JOB_NAME: E2E
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch GitHub secrets from Infisical
        if: needs.classify-changes.outputs.mutation_e2e == 'true'
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: preview
          secret-path: tools/github/secrets

      - name: Fetch web E2E secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: preview
          secret-path: /apps/web

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build E2E workspace dependencies
        run: pnpm turbo run build --filter=@app/api

      - name: Verify isolated mutation preview
        if: needs.classify-changes.outputs.mutation_e2e == 'true'
        env:
          ISOLATED: ${{ needs.preview.outputs.isolated }}
        run: test "$ISOLATED" = "true"

      - name: Resolve Neon PR database
        if: needs.classify-changes.outputs.mutation_e2e == 'true'
        id: db
        shell: bash
        env:
          BRANCH_NAME: ${{ needs.preview.outputs.database_branch }}
        run: bash .github/scripts/neon-database-branch.sh branch-url

      - name: Install Playwright Chromium
        run: pnpm --filter @app/web exec playwright install --with-deps chromium

      - name: Run safe E2E smoke tests
        if: needs.classify-changes.outputs.safe_e2e == 'true'
        env:
          E2E_BASE_URL: ${{ needs.preview.outputs.web_preview_url }}
        run: pnpm --filter @app/web test:e2e:ci

      - name: Run isolated E2E mutation fixtures
        if: needs.classify-changes.outputs.mutation_e2e == 'true'
        env:
          BUNNY_IMAGE_FOLDER_PREFIX: images/preview/pr-${{ github.event.pull_request.number }}
          BUNNY_RESOURCE_FOLDER_PREFIX: resources/preview/pr-${{ github.event.pull_request.number }}
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          E2E_BASE_URL: ${{ needs.preview.outputs.web_preview_url }}
          E2E_DATABASE_BRANCH: ${{ needs.preview.outputs.database_branch }}
          E2E_PR_NUMBER: ${{ github.event.pull_request.number }}
          E2E_RUN_MUTATIONS: "true"
          E2E_VERCEL_DEPLOYMENT_ID: ${{ needs.preview.outputs.deployment_id }}
        run: pnpm --filter @app/web exec playwright test --grep @mutation

      - name: Upload failed Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: playwright-report-${{ github.event.pull_request.number }}
          path: apps/web/playwright-report
          retention-days: 7

  development-api:
    name: Development API
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'development')
    runs-on: ubuntu-latest
    outputs:
      database_changed: ${{ steps.db_changes.outputs.database }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect database changes
        id: db_changes
        if: github.event_name == 'push'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/detect-database-changes.sh

      - name: Fetch deployment secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: preview
          secret-path: tools/github/secrets

      - name: Fetch API secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: dev
          secret-path: /apps/api

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API workspace dependencies
        run: pnpm turbo run build --filter=@app/api

      - name: Resolve development database URL
        id: development_db
        env:
          BRANCH_NAME: development
        run: bash .github/scripts/neon-database-branch.sh branch-url

      - name: Validate API development configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in AXIOM_DATASET AXIOM_TOKEN CLERK_SECRET_KEY CLERK_WEBHOOK_SIGNING_SECRET LINEAR_WEBHOOK_SIGNING_SECRET CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN LOG_PROXY_CLIENT_KEY ERASURE_HMAC_SECRET BUNNY_API_KEY BUNNY_CDN_BASE_URL BUNNY_CDN_TOKEN_KEY BUNNY_PULL_ZONE_ID BUNNY_STORAGE_ACCESS_KEY BUNNY_STORAGE_ENDPOINT BUNNY_STORAGE_ZONE_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Migrate, seed, and reconcile development users
        env:
          DATABASE_URL: ${{ steps.development_db.outputs.database_url }}
          MIGRATION_DATABASE_URL: ${{ steps.development_db.outputs.migration_database_url }}
        run: |
          set -euo pipefail
          DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm --filter @package/database exec drizzle-kit migrate --config=drizzle.config.ts
          DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm --filter @package/database exec tsx scripts/seed.ts
          pnpm --filter @app/api exec tsx src/scripts/reconcile-clerk-users.ts

      - name: Deploy stable development API
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ steps.development_db.outputs.database_url }}
        run: |
          set -euo pipefail

          pnpm exec wrangler deploy --env development --keep-vars \
            --var "APP_ENV:development" \
            --var "AXIOM_DATASET:${AXIOM_DATASET}" \
            --var "LOG_DEPLOYMENT_ID:development" \
            --var "LOG_DEPLOYMENT_TARGET:cloudflare-worker" \
            --var "BUNNY_CDN_BASE_URL:${BUNNY_CDN_BASE_URL}" \
            --var "BUNNY_IMAGE_FOLDER_PREFIX:images/dev" \
            --var "BUNNY_RESOURCE_FOLDER_PREFIX:resources/dev" \
            --var "BUNNY_STORAGE_ENDPOINT:${BUNNY_STORAGE_ENDPOINT}" \
            --var "BUNNY_STORAGE_ZONE_NAME:${BUNNY_STORAGE_ZONE_NAME}"
          jq -cn \
            --arg axiom_token "$AXIOM_TOKEN" \
            --arg clerk_secret_key "$CLERK_SECRET_KEY" \
            --arg clerk_webhook_signing_secret "$CLERK_WEBHOOK_SIGNING_SECRET" \
            --arg linear_webhook_signing_secret "$LINEAR_WEBHOOK_SIGNING_SECRET" \
            --arg database_url "$DATABASE_URL" \
            --arg erasure_hmac_secret "$ERASURE_HMAC_SECRET" \
            --arg log_proxy_client_key "$LOG_PROXY_CLIENT_KEY" \
            --arg bunny_api_key "$BUNNY_API_KEY" \
            --arg bunny_cdn_token_key "$BUNNY_CDN_TOKEN_KEY" \
            --arg bunny_pull_zone_id "$BUNNY_PULL_ZONE_ID" \
            --arg resource_storage_access_key "$BUNNY_STORAGE_ACCESS_KEY" \
            '{AXIOM_TOKEN: $axiom_token, CLERK_SECRET_KEY: $clerk_secret_key, CLERK_WEBHOOK_SIGNING_SECRET: $clerk_webhook_signing_secret, LINEAR_WEBHOOK_SIGNING_SECRET: $linear_webhook_signing_secret, DATABASE_URL: $database_url, ERASURE_HMAC_SECRET: $erasure_hmac_secret, LOG_PROXY_CLIENT_KEY: $log_proxy_client_key, BUNNY_API_KEY: $bunny_api_key, BUNNY_CDN_TOKEN_KEY: $bunny_cdn_token_key, BUNNY_PULL_ZONE_ID: $bunny_pull_zone_id, BUNNY_STORAGE_ACCESS_KEY: $resource_storage_access_key}' | \
            pnpm exec wrangler secret bulk --env development

          curl --fail --retry 5 --retry-all-errors --retry-delay 2 \
            --silent --show-error "https://dev-api.pocket-trash.app/api/v0/health" | \
            jq -e '.ok == true and .service == "api"' >/dev/null

  refresh-preview:
    name: Refresh shared preview
    needs: development-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.development-api.outputs.database_changed == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/preview-refresh.yml
    secrets: inherit

  preview-webhook-cleanup:
    name: Preview Webhook Cleanup
    if: github.event_name == 'pull_request' && github.event.action == 'unlabeled' && github.event.label.name == 'preview:webhooks' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch Cloudflare secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: preview
          secret-path: tools/github/secrets

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove preview webhook target
        working-directory: apps/api
        run: |
          set -euo pipefail
          pnpm exec wrangler kv key delete "target:preview:${{ github.event.pull_request.number }}" \
            --binding CLERK_WEBHOOK_TARGETS \
            --env development \
            --remote
          pnpm exec wrangler kv key delete "linear-target:preview:${{ github.event.pull_request.number }}" \
            --binding CLERK_WEBHOOK_TARGETS \
            --env development \
            --remote

  production:
    name: Production
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CI_JOB_NAME: Production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch GitHub secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: tools/github/secrets

      - name: Fetch API secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /apps/api

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API workspace dependencies
        run: pnpm turbo run build --filter=@app/api

      - name: Validate API production configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in AXIOM_DATASET AXIOM_TOKEN CLERK_SECRET_KEY CLERK_WEBHOOK_SIGNING_SECRET LINEAR_WEBHOOK_SIGNING_SECRET CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN LOG_PROXY_CLIENT_KEY ERASURE_HMAC_SECRET BUNNY_API_KEY BUNNY_CDN_BASE_URL BUNNY_CDN_TOKEN_KEY BUNNY_PULL_ZONE_ID BUNNY_STORAGE_ACCESS_KEY BUNNY_STORAGE_ENDPOINT BUNNY_STORAGE_ZONE_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Resolve production database URL
        id: production_db
        shell: bash
        env:
          BRANCH_NAME: production
        run: bash .github/scripts/neon-database-branch.sh branch-url

      - name: Run production migrations
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ steps.production_db.outputs.migration_database_url }}
        run: |
          set -euo pipefail

          set +e
          pnpm exec drizzle-kit migrate --config=drizzle.config.ts
          migration_status=$?
          set -e

          source ../../.github/scripts/ci-log.sh
          if [[ "$migration_status" -ne 0 ]]; then
            emit_ci_log error "ci.database.production.migrations.failed" "$(jq -n \
              --arg branch_name "${{ steps.production_db.outputs.branch_name }}" \
              --arg branch_id "${{ steps.production_db.outputs.branch_id }}" \
              --arg failure_step "drizzle-kit migrate" \
              '{
                branchName: $branch_name,
                branchId: $branch_id,
                failureStep: $failure_step
              }')"
            exit "$migration_status"
          fi

          emit_ci_log info "ci.database.production.migrations.applied" "$(jq -n \
            --arg branch_name "${{ steps.production_db.outputs.branch_name }}" \
            --arg branch_id "${{ steps.production_db.outputs.branch_id }}" \
            '{
              branchName: $branch_name,
              branchId: $branch_id
            }')"

      - name: Reconcile production Clerk users
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ steps.production_db.outputs.database_url }}
        run: pnpm exec tsx src/scripts/reconcile-clerk-users.ts

      - name: Deploy production API
        working-directory: apps/api
        shell: bash
        env:
          DATABASE_URL: ${{ steps.production_db.outputs.database_url }}
        run: |
          set -euo pipefail

          pnpm exec wrangler deploy --env="" --keep-vars \
            --var "APP_ENV:production" \
            --var "AXIOM_DATASET:${AXIOM_DATASET}" \
            --var "LOG_DEPLOYMENT_ID:production" \
            --var "LOG_DEPLOYMENT_TARGET:cloudflare-worker" \
            --var "BUNNY_CDN_BASE_URL:${BUNNY_CDN_BASE_URL}" \
            --var "BUNNY_IMAGE_FOLDER_PREFIX:images" \
            --var "BUNNY_RESOURCE_FOLDER_PREFIX:resources/files" \
            --var "BUNNY_STORAGE_ENDPOINT:${BUNNY_STORAGE_ENDPOINT}" \
            --var "BUNNY_STORAGE_ZONE_NAME:${BUNNY_STORAGE_ZONE_NAME}"
          jq -cn \
            --arg axiom_token "$AXIOM_TOKEN" \
            --arg clerk_secret_key "$CLERK_SECRET_KEY" \
            --arg clerk_webhook_signing_secret "$CLERK_WEBHOOK_SIGNING_SECRET" \
            --arg linear_webhook_signing_secret "$LINEAR_WEBHOOK_SIGNING_SECRET" \
            --arg database_url "$DATABASE_URL" \
            --arg erasure_hmac_secret "$ERASURE_HMAC_SECRET" \
            --arg log_proxy_client_key "$LOG_PROXY_CLIENT_KEY" \
            --arg bunny_api_key "$BUNNY_API_KEY" \
            --arg bunny_cdn_token_key "$BUNNY_CDN_TOKEN_KEY" \
            --arg bunny_pull_zone_id "$BUNNY_PULL_ZONE_ID" \
            --arg resource_storage_access_key "$BUNNY_STORAGE_ACCESS_KEY" \
            '{AXIOM_TOKEN: $axiom_token, CLERK_SECRET_KEY: $clerk_secret_key, CLERK_WEBHOOK_SIGNING_SECRET: $clerk_webhook_signing_secret, LINEAR_WEBHOOK_SIGNING_SECRET: $linear_webhook_signing_secret, DATABASE_URL: $database_url, ERASURE_HMAC_SECRET: $erasure_hmac_secret, LOG_PROXY_CLIENT_KEY: $log_proxy_client_key, BUNNY_API_KEY: $bunny_api_key, BUNNY_CDN_TOKEN_KEY: $bunny_cdn_token_key, BUNNY_PULL_ZONE_ID: $bunny_pull_zone_id, BUNNY_STORAGE_ACCESS_KEY: $resource_storage_access_key}' | \
            pnpm exec wrangler secret bulk --env=""

          curl --fail --retry 5 --retry-all-errors --retry-delay 2 \
            --silent --show-error "https://api.pocket-trash.app/api/v0/health" | \
            jq -e '.ok == true and .service == "api"' >/dev/null
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 \
            --silent --show-error "https://api.pocket-trash.app/api/v0/openapi.json" | \
            jq -e '.openapi == "3.1.0"' >/dev/null
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 \
            --silent --show-error "https://api.pocket-trash.app/api/v0/docs" >/dev/null

  railway-production:
    name: Railway Production
    needs: production
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch GitHub secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: tools/github/secrets

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag_name="${{ github.ref_name }}"
          else
            version="$(jq -r '.version' package.json)"
            tag_name="v${version}"
          fi

          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z. Got: $tag_name" >&2
            exit 1
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Validate Railway configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in RAILWAY_API_TOKEN RAILWAY_PROJECT_ID RAILWAY_SCRAPER_PRODUCTION_SERVICE_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Set Railway production metadata
        shell: bash
        run: |
          set -euo pipefail

          pnpm dlx @railway/cli variable set \
            APP_ENV=production \
            LOG_DEPLOYMENT_ID=production \
            LOG_DEPLOYMENT_TARGET=railway \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PRODUCTION_SERVICE_NAME" \
            --environment production

      - name: Deploy Railway production scraper
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          pnpm dlx @railway/cli up \
            --ci \
            --yes \
            --project "$RAILWAY_PROJECT_ID" \
            --environment production \
            --service "$RAILWAY_SCRAPER_PRODUCTION_SERVICE_NAME" \
            --message "Production release for $RELEASE_TAG"

  web-production:
    name: Web Production
    needs: production
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch GitHub secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: tools/github/secrets

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Vercel configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in VERCEL_PROJECT_ID VERCEL_ORG_ID VERCEL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Validate web app
        run: |
          pnpm exec turbo run test:ci --filter=@app/web
          pnpm lint
          pnpm exec turbo run typecheck --filter=@app/web

      - name: Align Vercel production framework
        env:
          NO_COLOR: "1"
        run: |
          pnpm dlx vercel project update "$VERCEL_PROJECT_ID" \
            --framework tanstack-start \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN" \
            --non-interactive

      - name: Pull Vercel production environment
        env:
          NO_COLOR: "1"
        run: pnpm dlx vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID"

      - name: Build Vercel production output
        shell: bash
        env:
          NITRO_PRESET: vercel
          NO_COLOR: "1"
        run: |
          set -euo pipefail

          set -a
          source .vercel/.env.production.local
          set +a

          rm -rf .vercel/output apps/web/.vercel/output
          pnpm build:ci --filter=@app/web

          if [[ -f .vercel/output/config.json ]]; then
            echo "Using .vercel/output"
          elif [[ -f apps/web/.vercel/output/config.json ]]; then
            mkdir -p .vercel
            mv apps/web/.vercel/output .vercel/output
            echo "Moved apps/web/.vercel/output to .vercel/output"
          else
            echo "No Vercel Build Output API config found." >&2
            exit 1
          fi

      - name: Deploy Vercel production
        id: vercel_deploy
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set -euo pipefail

          deployment_url="$(pnpm dlx vercel deploy --prebuilt --archive=tgz --prod --scope "$VERCEL_ORG_ID")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'Vercel production deployment: %s\n' "$deployment_url"

      - name: Smoke test Vercel production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment_url }}
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 3 "$DEPLOYMENT_URL"

  github-release:
    name: GitHub Release
    needs: [production, railway-production, web-production]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          notes_path="$RUNNER_TEMP/release-notes.md"
          node scripts/release.mjs --release-notes "$version" > "$notes_path"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $GITHUB_REF_NAME."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes_path"
