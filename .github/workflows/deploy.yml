name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - apps/scraper/**
      - packages/**
      - .github/scripts/**
      - .github/workflows/deploy.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - railway.json
      - turbo.json
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  DB_PREVIEW_COMMENT_MARKER: "<!-- pocket-trash-db-preview -->"
  RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME: "pocket-trash (preview)"
  RAILWAY_SCRAPER_PRODUCTION_SERVICE_NAME: "pocket-trash"
  RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME: "scraper-queue"

jobs:
  preview:
    name: Preview
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    env:
      CI_JOB_NAME: Preview
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch GitHub secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: preview
          secret-path: tools/github/secrets

      - name: Detect database changes
        id: db_changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          database=false

          if grep -Eq '^(packages/database/src/schema/|packages/database/drizzle/|packages/database/drizzle\.config\.ts$|packages/database/package\.json$)' <<< "$changed_files"; then
            database=true
          fi

          echo "database=$database" >> "$GITHUB_OUTPUT"
          {
            echo "changed_files<<EOF"
            printf '%s\n' "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          source .github/scripts/ci-log.sh
          emit_ci_log info "ci.database.preview.changeDetection.completed" "$(jq -n \
            --argjson database "$database" \
            --arg changed_files "$changed_files" \
            '{
              databaseChanged: $database,
              changedFiles: ($changed_files | split("\n") | map(select(. != "")))
            }')"

      - name: Sync db-change label
        uses: actions/github-script@v8
        env:
          DATABASE_CHANGED: ${{ steps.db_changes.outputs.database }}
        with:
          script: |
            const label = "db-change";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            if (process.env.DATABASE_CHANGED === "true") {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [label],
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: "0969da",
                  description: "Changes database schema or migrations",
                });
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [label],
                });
              }
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            console.log(JSON.stringify({
              app: "ci",
              environment: "github-actions",
              level: "info",
              message: "ci.github.dbChangeLabel.synced",
              timestamp: new Date().toISOString(),
              attributes: {
                databaseChanged: process.env.DATABASE_CHANGED === "true",
                label,
                pullRequestNumber: String(issue_number),
              },
            }));

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate preview database configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in NEON_API_KEY NEON_PROJECT_ID NEON_DATABASE_NAME NEON_DATABASE_USER VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN RAILWAY_API_TOKEN RAILWAY_PROJECT_ID RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Prepare Neon preview database
        id: db
        shell: bash
        env:
          DB_CHANGING: ${{ steps.db_changes.outputs.database }}
          MAX_NEON_BRANCHES: 10
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/neon-database-branch.sh prepare-preview

      - name: Configure Vercel branch database override
        if: steps.db.outputs.can_deploy == 'true' && steps.db_changes.outputs.database == 'true'
        id: vercel
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
        run: bash .github/scripts/vercel-branch-database-url.sh set

      - name: Remove stale Vercel branch database override
        if: steps.db.outputs.can_deploy == 'true' && steps.db_changes.outputs.database != 'true'
        id: vercel_cleanup
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/vercel-branch-database-url.sh remove

      - name: Configure Vercel branch image folder prefix
        if: steps.db.outputs.can_deploy == 'true'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          DB_CHANGING: ${{ steps.db_changes.outputs.database }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$DB_CHANGING" == "true" ]]; then
            export IMAGE_FOLDER_PREFIX="preview/pr-${PR_NUMBER}"
          else
            export IMAGE_FOLDER_PREFIX="preview"
          fi

          bash .github/scripts/vercel-branch-database-url.sh set-image-folder-prefix

      - name: Run migrations on Neon PR branch
        if: steps.db.outputs.can_deploy == 'true' && steps.db_changes.outputs.database == 'true'
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
        run: |
          set -euo pipefail

          set +e
          pnpm exec drizzle-kit migrate --config=drizzle.config.ts
          migration_status=$?
          set -e

          source ../../.github/scripts/ci-log.sh
          if [[ "$migration_status" -ne 0 ]]; then
            emit_ci_log error "ci.database.preview.migrations.failed" "$(jq -n \
              --arg branch_name "${{ steps.db.outputs.branch_name }}" \
              --arg branch_id "${{ steps.db.outputs.branch_id }}" \
              --arg failure_step "drizzle-kit migrate" \
              '{
                branchName: $branch_name,
                branchId: $branch_id,
                failureStep: $failure_step
              }')"
            exit "$migration_status"
          fi

          emit_ci_log info "ci.database.preview.migrations.applied" "$(jq -n \
            --arg branch_name "${{ steps.db.outputs.branch_name }}" \
            --arg branch_id "${{ steps.db.outputs.branch_id }}" \
            '{
              branchName: $branch_name,
              branchId: $branch_id
            }')"

      - name: Verify Neon PR branch
        if: steps.db.outputs.can_deploy == 'true' && steps.db_changes.outputs.database == 'true'
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.db.outputs.branch_name }}
        run: bash .github/scripts/neon-database-branch.sh branch-url

      - name: Configure Railway scraper preview database and cron
        if: steps.db.outputs.can_deploy == 'true'
        shell: bash
        env:
          DB_CHANGING: ${{ steps.db_changes.outputs.database }}
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          printf '::add-mask::%s\n' "$DATABASE_URL"

          railway_environment="pocket-trash-pr-${PR_NUMBER}"
          if [[ "$DB_CHANGING" == "true" ]]; then
            image_folder_prefix="preview/pr-${PR_NUMBER}"
            scraper_cron_enabled="true"
          else
            image_folder_prefix="preview"
            scraper_cron_enabled="false"
          fi
          redis_url_reference='$'"{{${RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME}.REDIS_PUBLIC_URL}}"

          jq -cn \
            --arg app "ci" \
            --arg environment "github-actions" \
            --arg level "info" \
            --arg message "ci.railway.preview.imageFolderPrefix.selected" \
            --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg railway_environment "$railway_environment" \
            --arg service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --arg image_folder_prefix "$image_folder_prefix" \
            --arg scraper_cron_enabled "$scraper_cron_enabled" \
            --argjson database "$DB_CHANGING" \
            '{
              app: $app,
              environment: $environment,
              level: $level,
              message: $message,
              timestamp: $timestamp,
              attributes: {
                databaseChanged: $database,
                railwayEnvironment: $railway_environment,
                service: $service,
                imageFolderPrefix: $image_folder_prefix,
                scraperCronEnabled: $scraper_cron_enabled
              }
            }'

          printf '%s' "$DATABASE_URL" | pnpm dlx @railway/cli variable set DATABASE_URL \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          printf '%s' "$image_folder_prefix" | pnpm dlx @railway/cli variable set IMAGE_FOLDER_PREFIX \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          printf '%s' "$redis_url_reference" | pnpm dlx @railway/cli variable set REDIS_URL \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          printf '%s' "$scraper_cron_enabled" | pnpm dlx @railway/cli variable set SCRAPER_CRON_ENABLED \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          printf '%s' "$railway_environment" | pnpm dlx @railway/cli variable set LOG_DEPLOYMENT_ID \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          printf '%s' "railway" | pnpm dlx @railway/cli variable set LOG_DEPLOYMENT_TARGET \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          railway_image_folder_prefix="$(
            pnpm dlx @railway/cli variable list \
              --kv \
              --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
              --environment "$railway_environment" |
              awk -F= '$1 == "IMAGE_FOLDER_PREFIX" {print substr($0, index($0, "=") + 1)}'
          )"

          if [[ "$railway_image_folder_prefix" != "$image_folder_prefix" ]]; then
            echo "Railway IMAGE_FOLDER_PREFIX did not match expected preview prefix." >&2
            echo "Expected: ${image_folder_prefix}" >&2
            echo "Actual: ${railway_image_folder_prefix:-<unset>}" >&2
            exit 1
          fi

          railway_scraper_cron_enabled="$(
            pnpm dlx @railway/cli variable list \
              --kv \
              --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SCRAPER_PREVIEW_SERVICE_NAME" \
              --environment "$railway_environment" |
              awk -F= '$1 == "SCRAPER_CRON_ENABLED" {print substr($0, index($0, "=") + 1)}'
          )"

          if [[ "$railway_scraper_cron_enabled" != "$scraper_cron_enabled" ]]; then
            echo "Railway SCRAPER_CRON_ENABLED did not match expected preview setting." >&2
            echo "Expected: ${scraper_cron_enabled}" >&2
            echo "Actual: ${railway_scraper_cron_enabled:-<unset>}" >&2
            exit 1
          fi

      - name: Deploy Railway scraper queue preview
        if: steps.db.outputs.can_deploy == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          railway_environment="pocket-trash-pr-${PR_NUMBER}"

          jq -cn \
            --arg app "ci" \
            --arg environment "github-actions" \
            --arg level "info" \
            --arg message "ci.railway.preview.queue.deployStarted" \
            --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg railway_environment "$railway_environment" \
            --arg service "$RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME" \
            '{
              app: $app,
              environment: $environment,
              level: $level,
              message: $message,
              timestamp: $timestamp,
              attributes: {
                railwayEnvironment: $railway_environment,
                service: $service
              }
            }'

          printf '%s' "$railway_environment" | pnpm dlx @railway/cli variable set LOG_DEPLOYMENT_ID \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          printf '%s' "railway" | pnpm dlx @railway/cli variable set LOG_DEPLOYMENT_TARGET \
            --stdin \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

          pnpm dlx @railway/cli service redeploy \
            --from-source \
            --yes \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_QUEUE_PREVIEW_SERVICE_NAME" \
            --environment "$railway_environment"

      - name: Create DB preview comment app token
        id: db-preview-comment-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.POCKET_TRASH_DB_PREVIEW_APP_CLIENT_ID }}
          private-key: ${{ env.POCKET_TRASH_DB_PREVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Comment on blocked DB preview
        if: steps.db_changes.outputs.database == 'true' && steps.db.outputs.can_deploy != 'true'
        uses: actions/github-script@v8
        env:
          BRANCH_COUNT: ${{ steps.db.outputs.branch_count }}
          BRANCH_NAMES: ${{ steps.db.outputs.branch_names }}
          TARGET_BRANCH: ${{ steps.db.outputs.target_branch }}
        with:
          github-token: ${{ steps.db-preview-comment-token.outputs.token }}
          script: |
            const marker = process.env.DB_PREVIEW_COMMENT_MARKER;
            const branchNames = (process.env.BRANCH_NAMES || "")
              .split("\n")
              .filter(Boolean)
              .map((name) => `- \`${name}\``)
              .join("\n");
            const retryUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/deploy.yml`;
            const body = [
              marker,
              "DB-isolated preview creation is blocked because the Neon branch limit has been reached.",
              "",
              `Requested branch: \`${process.env.TARGET_BRANCH}\``,
              `Branch capacity: \`${process.env.BRANCH_COUNT}/10\``,
              "",
              "Active Neon branches:",
              branchNames || "- none reported",
              "",
              "Close stale DB-changing PRs or delete stale `preview-pr-*` branches, then push a new commit or rerun the Deploy workflow.",
              "",
              `[Retry workflow](${retryUrl})`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Comment on ready DB preview
        if: steps.db_changes.outputs.database == 'true' && steps.db.outputs.can_deploy == 'true'
        uses: actions/github-script@v8
        env:
          BRANCH_NAME: ${{ steps.db.outputs.branch_name }}
          BRANCH_URL: ${{ steps.db.outputs.branch_url }}
          PARENT_BRANCH: ${{ steps.db.outputs.parent_branch }}
          WEB_PREVIEW_URL: ${{ steps.vercel.outputs.web_preview_url }}
        with:
          github-token: ${{ steps.db-preview-comment-token.outputs.token }}
          script: |
            const marker = process.env.DB_PREVIEW_COMMENT_MARKER;
            const webPreviewUrl = process.env.WEB_PREVIEW_URL;
            const webPreview = webPreviewUrl
              ? `[Preview](${webPreviewUrl})`
              : "Vercel preview URL not available to this workflow yet; the branch-specific env var is set for the next preview deployment.";
            const body = [
              marker,
              "DB-isolated preview is ready for this pull request.",
              "",
              "| Item | Value |",
              "| --- | --- |",
              `| Neon branch | [\`${process.env.BRANCH_NAME}\`](${process.env.BRANCH_URL}) |`,
              `| Parent branch | \`${process.env.PARENT_BRANCH}\` |`,
              "| Migration status | Committed Drizzle migrations applied |",
              `| Web preview | ${webPreview} |`,
              "",
              "The `preview-pr-*` branch and branch-specific Vercel `DATABASE_URL` and `IMAGE_FOLDER_PREFIX` are deleted when the PR closes or no longer contains DB changes.",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Cleanup failed DB preview resources
        if: ${{ always() && steps.db_changes.outputs.database == 'true' && steps.db.outputs.branch_created == 'true' && (failure() || cancelled()) }}
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e

          bash .github/scripts/neon-database-branch.sh cleanup-preview
          neon_status=$?

          bash .github/scripts/vercel-branch-database-url.sh remove
          vercel_status=$?

          bash .github/scripts/vercel-branch-database-url.sh remove-image-folder-prefix
          vercel_image_status=$?

          if [[ "$neon_status" -ne 0 || "$vercel_status" -ne 0 || "$vercel_image_status" -ne 0 ]]; then
            echo "Preview cleanup encountered errors: neon=${neon_status}, vercel=${vercel_status}, vercel_image=${vercel_image_status}." >&2
          fi

          exit 0

  production:
    name: Production
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CI_JOB_NAME: Production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch GitHub secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: tools/github/secrets

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve production database URL
        id: production_db
        shell: bash
        env:
          BRANCH_NAME: production
        run: bash .github/scripts/neon-database-branch.sh branch-url

      - name: Run production migrations
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ steps.production_db.outputs.database_url }}
        run: |
          set -euo pipefail

          set +e
          pnpm exec drizzle-kit migrate --config=drizzle.config.ts
          migration_status=$?
          set -e

          source ../../.github/scripts/ci-log.sh
          if [[ "$migration_status" -ne 0 ]]; then
            emit_ci_log error "ci.database.production.migrations.failed" "$(jq -n \
              --arg branch_name "${{ steps.production_db.outputs.branch_name }}" \
              --arg branch_id "${{ steps.production_db.outputs.branch_id }}" \
              --arg failure_step "drizzle-kit migrate" \
              '{
                branchName: $branch_name,
                branchId: $branch_id,
                failureStep: $failure_step
              }')"
            exit "$migration_status"
          fi

          emit_ci_log info "ci.database.production.migrations.applied" "$(jq -n \
            --arg branch_name "${{ steps.production_db.outputs.branch_name }}" \
            --arg branch_id "${{ steps.production_db.outputs.branch_id }}" \
            '{
              branchName: $branch_name,
              branchId: $branch_id
            }')"

  railway-production:
    name: Railway Production
    needs: production
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch GitHub secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: tools/github/secrets

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag_name="${{ github.ref_name }}"
          else
            version="$(jq -r '.version' package.json)"
            tag_name="v${version}"
          fi

          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z. Got: $tag_name" >&2
            exit 1
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Validate Railway configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in RAILWAY_API_TOKEN RAILWAY_PROJECT_ID RAILWAY_SCRAPER_PRODUCTION_SERVICE_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Set Railway production metadata
        shell: bash
        run: |
          set -euo pipefail

          pnpm dlx @railway/cli variable set APP_ENV=production \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PRODUCTION_SERVICE_NAME" \
            --environment production

          pnpm dlx @railway/cli variable set LOG_DEPLOYMENT_ID=production \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PRODUCTION_SERVICE_NAME" \
            --environment production

          pnpm dlx @railway/cli variable set LOG_DEPLOYMENT_TARGET=railway \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SCRAPER_PRODUCTION_SERVICE_NAME" \
            --environment production

      - name: Deploy Railway production scraper
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          pnpm dlx @railway/cli up \
            --ci \
            --yes \
            --project "$RAILWAY_PROJECT_ID" \
            --environment production \
            --service "$RAILWAY_SCRAPER_PRODUCTION_SERVICE_NAME" \
            --message "Production release for $RELEASE_TAG"

      - name: Verify Railway production deployment
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          latest_deployment="$(
            pnpm dlx @railway/cli deployment list \
              --project "$RAILWAY_PROJECT_ID" \
              --environment production \
              --service "$RAILWAY_SCRAPER_PRODUCTION_SERVICE_NAME" \
              --limit 1 \
              --json
          )"
          status="$(jq -r '.[0].status // empty' <<< "$latest_deployment")"
          message="$(jq -r '.[0].meta.message // .[0].meta.commitMessage // empty' <<< "$latest_deployment")"

          if [[ "$status" != "SUCCESS" ]]; then
            echo "Railway production deployment did not succeed. Status: ${status:-<empty>}" >&2
            exit 1
          fi

          expected_message="Production release for $RELEASE_TAG"
          if [[ -z "$message" ]]; then
            echo "Railway production deployment message was empty; status is SUCCESS." >&2
          elif [[ "$message" != "$expected_message" ]]; then
            echo "Railway production deployment message did not match; status is SUCCESS." >&2
            echo "Expected: $expected_message" >&2
            echo "Actual: $message" >&2
          fi

  web-production:
    name: Web Production
    needs: production
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch GitHub secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: tools/github/secrets

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Vercel configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in VERCEL_PROJECT_ID VERCEL_ORG_ID VERCEL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

      - name: Validate web app
        run: |
          pnpm exec turbo run test:ci --filter=@app/web
          pnpm --filter @app/web run lint
          pnpm exec turbo run typecheck --filter=@app/web

      - name: Align Vercel production framework
        env:
          NO_COLOR: "1"
        run: |
          pnpm dlx vercel project update "$VERCEL_PROJECT_ID" \
            --framework tanstack-start \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN" \
            --non-interactive

      - name: Pull Vercel production environment
        env:
          NO_COLOR: "1"
        run: pnpm dlx vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID"

      - name: Build Vercel production output
        shell: bash
        env:
          NITRO_PRESET: vercel
          NO_COLOR: "1"
        run: |
          set -euo pipefail

          set -a
          source .vercel/.env.production.local
          set +a

          rm -rf .vercel/output apps/web/.vercel/output
          pnpm build:ci --filter=@app/web

          if [[ -f .vercel/output/config.json ]]; then
            echo "Using .vercel/output"
          elif [[ -f apps/web/.vercel/output/config.json ]]; then
            mkdir -p .vercel
            mv apps/web/.vercel/output .vercel/output
            echo "Moved apps/web/.vercel/output to .vercel/output"
          else
            echo "No Vercel Build Output API config found." >&2
            exit 1
          fi

      - name: Deploy Vercel production
        id: vercel_deploy
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set -euo pipefail

          deployment_url="$(pnpm dlx vercel deploy --prebuilt --archive=tgz --prod --scope "$VERCEL_ORG_ID")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'Vercel production deployment: %s\n' "$deployment_url"

      - name: Smoke test Vercel production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment_url }}
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 3 "$DEPLOYMENT_URL"
