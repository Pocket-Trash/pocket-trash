name: Discord Notifications

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - synchronize
      - review_requested
      - review_request_removed
      - closed
  pull_request_review:
    types:
      - submitted
      - dismissed
  push:
    branches: [main]
  workflow_run:
    workflows: [CI, Logger Live]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Notify Discord
    if: ${{ !((github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name != github.repository) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch GitHub secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: preview
          secret-path: tools/github/secrets

      - name: Send Discord notification
        run: pnpm --filter @package/github-discord-notifier notify
