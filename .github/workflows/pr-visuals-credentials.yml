name: PR Visuals credential check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  credential:
    if: github.repository == 'Pocket-Trash/pocket-trash' && github.ref == 'refs/heads/main'
    name: ${{ matrix.credential }} credential
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        credential: [analysis, publication]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Pocket-Trash/pr-review-tool
          ref: current-release
          path: reviewer
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Read and validate the exact credential without inference or publication
        run: node reviewer/src/infisical.mjs "$CREDENTIAL_KIND"
        env:
          CREDENTIAL_KIND: ${{ matrix.credential }}
          REVIEW_PROVIDER: openrouter
          INFISICAL_GITHUB_IDENTITY_ID: ${{ secrets.INFISICAL_GITHUB_IDENTITY_ID }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
          INFISICAL_OIDC_AUDIENCE: ${{ secrets.INFISICAL_OIDC_AUDIENCE }}
          INFISICAL_PROJECT_ID: 1d68bea3-0525-453f-b380-3cdc82cad1f8
          INFISICAL_ENVIRONMENT: preview
          INFISICAL_SECRET_PATH: /tools/github/pr-review-tool
