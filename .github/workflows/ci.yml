name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read

jobs:
  classify-changes:
    name: Classify Changes
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.classify.outputs.api }}
      scraper: ${{ steps.classify.outputs.scraper }}
      web: ${{ steps.classify.outputs.web }}
      database: ${{ steps.classify.outputs.database }}
      storybook: ${{ steps.classify.outputs.storybook }}
      preview: ${{ steps.classify.outputs.preview }}
      safe_e2e: ${{ steps.classify.outputs.safe_e2e }}
      mutation_e2e: ${{ steps.classify.outputs.mutation_e2e }}
      validation: ${{ steps.classify.outputs.validation }}
      unknown_paths: ${{ steps.classify.outputs.unknown_paths }}
      classification_error: ${{ steps.classify.outputs.classification_error }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if ! node scripts/classify-changes.mjs; then
            for domain in api scraper web database storybook preview safe_e2e mutation_e2e validation; do
              echo "$domain=true" >> "$GITHUB_OUTPUT"
            done
            echo 'unknown_paths=[]' >> "$GITHUB_OUTPUT"
            echo 'classification_error=classifier-failed' >> "$GITHUB_OUTPUT"
          fi

  classification:
    name: Classification
    needs: classify-changes
    if: >-
      always() &&
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest

    steps:
      - name: Require explicit path classification
        env:
          CLASSIFICATION_ERROR: ${{ needs.classify-changes.outputs.classification_error }}
          UNKNOWN_PATHS: ${{ needs.classify-changes.outputs.unknown_paths }}
        run: |
          if [[ -n "$CLASSIFICATION_ERROR" ]]; then
            echo "Change classification failed: $CLASSIFICATION_ERROR" >&2
            exit 1
          fi

          if [[ "$UNKNOWN_PATHS" != "[]" ]]; then
            echo "Unclassified repository paths:" >&2
            jq -r '.[] | "- \(.)"' <<< "$UNKNOWN_PATHS" >&2
            exit 1
          fi

  metadata:
    name: Metadata
    if: github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  security:
    name: Security
    if: github.event_name != 'pull_request' || ((github.event.action != 'edited' || github.event.changes.base != null) && github.event.action != 'labeled' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm security:audit

  changeset:
    name: Changeset
    if: github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changelog reminder
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-changelog-reminder.mjs

      - name: Validate PR Changeset
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-pr-changeset.mjs

  scraper-artifact:
    name: Scraper Artifact
    needs: [security, classify-changes]
    if: >-
      always() &&
      needs.classify-changes.result == 'success' &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      needs.classify-changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Railway upload context
        run: node scripts/check-railway-context.mjs

      - name: Build scraper artifact
        run: pnpm --filter @app/scraper... build

  api-artifact:
    name: API Artifact
    needs: [security, classify-changes]
    if: >-
      always() &&
      needs.classify-changes.result == 'success' &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      needs.classify-changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API workspace dependencies
        run: pnpm exec turbo run build:ci --filter=@app/api

      - name: Build Cloudflare Worker artifact
        run: pnpm --filter @app/api exec wrangler deploy --dry-run --env="" --outdir "$RUNNER_TEMP/api-worker"

  web-artifact:
    name: Web Artifact
    needs: [security, classify-changes]
    if: >-
      always() &&
      needs.classify-changes.result == 'success' &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      needs.classify-changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vercel artifact
        env:
          CLERK_SECRET_KEY: ci-placeholder
          DATABASE_URL: postgres://ci:ci@localhost/ci
          ERASURE_HMAC_SECRET: ci-placeholder-erasure-secret-000000000
          NITRO_PRESET: vercel
          VITE_API_URL: https://example.com
          VITE_CLERK_PUBLISHABLE_KEY: ci-placeholder
          VITE_CLERK_SIGN_IN_URL: /sign-in
          VITE_CLERK_SIGN_UP_URL: /sign-up
        run: pnpm build:ci --filter=@app/web

      - name: Validate Vercel Build Output
        run: test -f .vercel/output/config.json || test -f apps/web/.vercel/output/config.json

  lint:
    name: Lint and Typecheck
    needs: [security, classify-changes]
    if: >-
      always() &&
      needs.classify-changes.result == 'success' &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      needs.classify-changes.outputs.validation == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

  test:
    name: Test
    needs: [security, classify-changes]
    if: >-
      always() &&
      needs.classify-changes.result == 'success' &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      needs.classify-changes.outputs.validation == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:ci

  storybook-test:
    name: Storybook Tests
    needs: [security, classify-changes]
    if: >-
      always() &&
      needs.classify-changes.result == 'success' &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      needs.classify-changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @app/web exec playwright install --with-deps chromium

      - name: Run Storybook tests
        run: pnpm exec turbo run test-storybook --filter=@app/web

  drizzle-check:
    name: Drizzle Migration Check
    needs: [security, classify-changes]
    if: >-
      always() &&
      needs.classify-changes.result == 'success' &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      needs.classify-changes.outputs.database == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Drizzle migration history
        working-directory: packages/database
        run: pnpm exec drizzle-kit check --config=drizzle.config.ts
