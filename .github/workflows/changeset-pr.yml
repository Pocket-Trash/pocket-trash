name: Changeset PR

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: changeset-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-pr-changeset.mjs
      - if: always() && steps.check.outputs.checked == 'true'
        uses: actions/github-script@v8
        env:
          BUMP: ${{ steps.check.outputs.bump }}
        with:
          script: |
            const releaseLabels = ['major', 'minor', 'patch'];
            const bump = process.env.BUMP;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, { owner, repo, issue_number });
            const currentLabels = new Set(labels.map(({ name }) => name));

            for (const label of releaseLabels) {
              if (label !== bump && currentLabels.has(label)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              }
            }

            if (bump && !currentLabels.has(bump)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [bump] });
            }
