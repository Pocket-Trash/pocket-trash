version: 2
registries:
  fontawesome:
    type: npm-registry
    url: https://npm.fontawesome.com
    token: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Toronto
    open-pull-requests-limit: 0
    versioning-strategy: increase
    cooldown:
      default-days: 7
    registries:
      - fontawesome
    allow:
      - dependency-name: yaml
    groups:
      compatible:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    commit-message:
      prefix: chore
      include: scope
